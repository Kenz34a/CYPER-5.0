name: Build apps
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: android
        options: [android, ios-simulator, both]
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:debug
      - uses: actions/upload-artifact@v4
        with:
          name: cyper-zero-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios-simulator:
    if: inputs.platform == 'ios-simulator' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | awk '/Xcode/ {if ($2+0 < 26) exit 1}'
      - run: npm ci
      - run: npm run mobile:build
      - run: npx cap sync ios
      - name: Build simulator app
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app cyper-zero-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cyper-zero-ios-simulator
          path: cyper-zero-ios-simulator.zip
          if-no-files-found: error
